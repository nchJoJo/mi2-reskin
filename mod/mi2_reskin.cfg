; MI2 Reskin settings: the mod's defaults.
; Players change the main options in the game itself: Settings > Mods > Reskin. Those choices are saved in
; %APPDATA%\Games By Malcs\Melvor Idle 2\mi2_reskin_settings.cfg and win over this file; "Reset to defaults"
; on that page deletes them. To change the defaults, edit this copy, run install.ps1 again and restart.

[reskin]

; Start with the reskin on. F7 switches it on and off while you play.
enabled=true

; Redraw the brush-stroke picture panels (headers, cards, buttons, tooltips, top and bottom bars)
; as clean flat panels in the same colours. This is what removes the jagged, blurry edges.
flatten_textures=true

; How those panels are drawn:
;   "crafted" = one look per kind of part: framed panels with a bronze trim and corner studs,
;               headers with a gold underline, bevelled buttons, gold trim on selected items,
;               recessed grey locked cards and warm-edged item slots.
;   "flat"    = plain flat panels in the same colours, with only a thin darker rim.
look="crafted"

; With look="crafted", the finish:
;   "crafted" = bronze trim, corner studs on big frames, gold header underlines with small end studs;
;   "soft"    = Melvor Idle 1's calm look in Melvor Idle 2's colours: flat panels with rounded corners,
;               no trims, bevels or underlines, muted teal and button colours, dark labels with light
;               text, and a little more padding inside cards;
;   "gilded"  = brighter bronze and gold, and gold-edged cards.
; "soft" is the default.
preset="soft"

; With look="crafted": show header titles, page titles and label plaques in a title font, and the
; small captions on header bars ("Tree", "Bush") in a matching caption font. Both fonts are in
; mod\fonts (SIL Open Font License). Buttons, dropdowns and body text keep the game's font.
; The game's version text also moves to just under the top bar, in the right corner.
title_font=true
title_font_file="AlegreyaSC-Bold.ttf"

; Font for the small captions ("" keeps the game's font), and pixels added between its letters.
caption_font_file="AlegreyaSansSC-Bold.ttf"
caption_spacing=1

; With look="crafted": the body font for all other text. "Rubik" (softly rounded, made for screens,
; SIL Open Font License, in modonts) or "game" for the game's own font. Other fonts can be added to
; modonts as <Name>-400.ttf, -500, -600 and -700, then named here.
body_font="Rubik"

; Panel colours: "mi2" (Melvor Idle 2's warm browns), "slate" (Melvor Idle 1's slate blues),
; "graphite" (neutral dark greys) or "midnight" (deep blue-black). Bright accent colours always stay.
palette="mi2"

; Accent colour of bars, dividers, scrollbar grips and selected outlines: "finish" (the finish's own),
; "sand", "gold" or "silver".
accent="finish"

; Corner rounding of those flat panels, in pixels (0 = square corners).
panel_radius=6

; With look="flat": how much darker the 1-pixel rim is (0 = no rim, 0.25 = a soft outline).
panel_border=0.25

; How solid the dark panels are (1 = solid, 0.85 = the painted scenery shows through a little).
panel_opacity=1.0

; Straighten flat panels that are slanted (none are in v0.11.6, but later game versions may add some).
straighten=true

; Draw straightened square panels with sharp edges instead of soft, anti-aliased ones.
crisp_edges=true

; Corner rounding for the game's other flat panels. -1 keeps the game's own corners.
corner_radius=-1

; Key that switches the reskin on and off.
toggle_key="F7"

[frame]

; With look="crafted", tidy the game's frame:
;  - hide the "Cozy UI Mode - coming soon" teaser in the top bar;
;  - hover labels on the footer's groups (tracking window, action, experience, bank, equipment);
;  - sidebar group headings ("Combat", "Passive", "Non-Combat") in the title font, in gold;
;  - a recessed slot in the top bar for another mod's status display, shown only while one is loaded.
tidy=true
; Other mods whose interfaces keep their own look and get the top-bar slot: the start of their top-level
; node names, separated by commas. Mods can also add their top-level node to the "mi2_reskin_keep_look" group.
; Settings for this computer only can go in mod\mi2_reskin_local.cfg (same layout); install.ps1 copies it.
other_mods=""

[pages]

; With look="crafted", tidy the pages:
;  - lists of trees, recipes, fishing areas and so on show only the next locked entry; the later
;    locked ones appear one at a time as you unlock the one before;
;  - on crafting pages (Smithing, Cooking, ...) the "Creating" column only shows while something is
;    being made, so the page isn't half empty while idle;
;  - the Bank's strip of mouse shortcuts under the items becomes a "?" next to the search box
;    (hover it to read them);
;  - Farming's empty bars on plots you haven't bought stop drawing;
;  - the Quests page's "Quest Dialogue" column only shows once the quest has dialogue.
tidy=true

; Crafting pages (Cooking, Smithing, Firemaking, ...) and the Shop reopen the category you used last
; there, or the first one, instead of "Please select a Category" or an empty list.
remember_category=true

; The hard black copy of rock, tree and monster pictures drawn behind them as a shadow:
; "off" = none, "faint" = a light one (the default), "game" = the game's own.
picture_shadows="faint"

; A framed panel behind the selected rock's or tree's details on Mining, Woodcutting and similar pages.
detail_frame=false

[polish]

; With look="crafted". Each can be switched off on its own; F7 still puts the game's own look back.

; Progress bars (Mining, crafting timers) get a dark inset track with a bronze rim and a bevelled fill;
; the footer's level bar gets the same track.
bars=true

; Slim scrollbars: a dark slot with a bronze grip that brightens on hover and turns gold while dragged.
scrollbars=true

; Sidebar: slim gold level bars, a gold edge and gold name on the active skill, and a bronze divider
; with a small diamond after each heading.
sidebar=true

; Pages fade in when they open; cards in lists (rocks, trees, recipes, bank items) get a gold outline
; under the mouse.
motion=true

; Item tooltips show the item's name in the title font, in gold, with a bronze line under it.
tooltips=true

; Mouse pointer: "sword" (a small sword drawn by the mod, with a glint while the button is held) or
; "off" for the normal pointer.
cursor="sword"

; Even-width digits in the game's fonts, so counts and timers don't jiggle as they change.
even_digits=true

[mi1]

; Show Melvor Idle 1's skill and item icons where an MI1 picture exists. They are read from your own
; Melvor Idle 1 install (found through Steam); nothing is copied. Without MI1, MI2's icons stay.
icons=false

; Older setting: theme=true is the same as [reskin] palette="slate".
theme=false

; With palette "slate", "graphite" or "midnight", keep MI2's teal header bars instead of recolouring them.
keep_teal_headers=false

; With palette="slate", also hide the painted scenery behind the pages for MI1's plain background.
plain_background=false

; Where Melvor Idle 1 is, if it is not found by itself: the "Melvor Idle" folder or its assets\media.
path=""

[dev]

; For mod development only. When true, the mod reads commands from mi2_reskin_cmd.txt in the game's
; user folder (reload, at X Y, tree, stats, tex NAME, on, off). install.ps1 -Dev turns this on.
enabled=false
